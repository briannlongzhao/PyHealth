version: "1.0"
tables:
  participants:
    file_path: "pmdata-participants.csv"
    patient_id: "participant_id"
    timestamp: null
    attributes:
      - "age"
      - "height"
      - "gender"
      - "a_or_b_person"
      - "max_heart_rate"
      - "stride_walk"
      - "stride_run"
  fitbit_hourly:
    file_path: "pmdata-fitbit_hourly.csv"
    patient_id: "participant_id"
    timestamp: "timestamp"
    timestamp_format: "%Y-%m-%d %H:%M:%S"
    attributes:
      - "steps"
      - "heart_rate"
      - "calories"
      - "distance"
  fitbit_daily:
    file_path: "pmdata-fitbit_daily.csv"
    patient_id: "participant_id"
    timestamp: "date"
    timestamp_format: "%Y-%m-%d %H:%M:%S"
    attributes:
      - "sedentary_minutes"
      - "lightly_active_minutes"
      - "moderately_active_minutes"
      - "very_active_minutes"
      - "resting_heart_rate"
      - "below_default_zone_1"
      - "in_default_zone_1"
      - "in_default_zone_2"
      - "in_default_zone_3"
  sleep:
    file_path: "pmdata-sleep.csv"
    patient_id: "participant_id"
    timestamp: "start_time"
    timestamp_format: "%Y-%m-%d %H:%M:%S"
    attributes:
      - "end_time"
      - "date_of_sleep"
      - "main_sleep"
      - "minutes_to_fall_asleep"
      - "minutes_asleep"
      - "minutes_awake"
      - "time_in_bed"
      - "efficiency"
      - "deep_minutes"
      - "light_minutes"
      - "rem_minutes"
      - "wake_minutes"
  sleep_score:
    file_path: "pmdata-sleep_score.csv"
    patient_id: "participant_id"
    timestamp: "timestamp"
    timestamp_format: "%Y-%m-%d %H:%M:%S"
    attributes:
      - "overall_score"
      - "composition_score"
      - "revitalization_score"
      - "duration_score"
      - "deep_sleep_in_minutes"
      - "resting_heart_rate"
      - "restlessness"
  exercise:
    file_path: "pmdata-exercise.csv"
    patient_id: "participant_id"
    timestamp: "start_time"
    timestamp_format: "%Y-%m-%d %H:%M:%S"
    attributes:
      - "activity_name"
      - "log_type"
      - "duration_min"
      - "active_duration_min"
      - "calories"
      - "steps"
      - "distance"
      - "average_heart_rate"
  wellness:
    file_path: "pmdata-wellness.csv"
    patient_id: "participant_id"
    timestamp: "timestamp"
    timestamp_format: "%Y-%m-%d %H:%M:%S"
    attributes:
      - "fatigue"
      - "mood"
      - "readiness"
      - "sleep_duration_h"
      - "sleep_quality"
      - "soreness"
      - "soreness_area"
      - "stress"
  srpe:
    file_path: "pmdata-srpe.csv"
    patient_id: "participant_id"
    timestamp: "timestamp"
    timestamp_format: "%Y-%m-%d %H:%M:%S"
    attributes:
      - "activity_names"
      - "perceived_exertion"
      - "duration_min"
  injury:
    file_path: "pmdata-injury.csv"
    patient_id: "participant_id"
    timestamp: "timestamp"
    timestamp_format: "%Y-%m-%d %H:%M:%S"
    attributes:
      - "injuries"
  reporting:
    file_path: "pmdata-reporting.csv"
    patient_id: "participant_id"
    timestamp: "date"
    timestamp_format: "%Y-%m-%d %H:%M:%S"
    attributes:
      - "meals"
      - "weight"
      - "glasses_of_fluid"
      - "alcohol_consumed"
  food_images:
    file_path: "pmdata-food_images.csv"
    patient_id: "participant_id"
    timestamp: "timestamp"
    timestamp_format: "%Y-%m-%d %H:%M:%S"
    attributes:
      - "image_path"
